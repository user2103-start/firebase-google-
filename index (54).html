<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.0/shaka-player.compiled.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px; }
  video { width: 100%; max-height: 70vh; background: #000; display: block; }
  iframe { width: 100%; height: 80vh; background: #000; border: 0; margin-top: 10px; }
  button { padding: 8px 14px; margin: 6px 6px 6px 0; cursor: pointer; }
  pre { background: #000; padding: 10px; height: 240px; overflow: auto; font: 12px/1.4 monospace;
        white-space: pre-wrap; word-break: break-all; border: 1px solid #333; color: #aaa; }
  .err { color: #f66; }
</style>
</head>
<body>
<div class="wrap">
  <video id="video" controls playsinline></video>
  <div>
    <button id="playBtn">Play video</button>
    <button id="liveBtn">Play live</button>
    <button id="schedBtn">Today's schedule</button>
    <button id="pdfBtn">Open PDF</button>
  </div>
  <iframe id="pdfFrame" hidden></iframe>
  <pre id="log"></pre>
</div>

<script>
// ===== Config (same domain as the proxy, so relative /api path) =====
const API = "/api";
const BATCH_ID = "698ad3519549b300a5e1cc6a";
const VIDEO_SUBJECT_ID = "688ddbdc510064d4022855c9";
const CHILD_ID = "6a940abeea1638c3a6570dd2";
const VIDEO_TYPE = "awsVideo";
const LIVE = {
  subjectId: "69b572321258ab0500483ec4",
  childId: "6a940a4aea1638c3a656fe8e",
};
const PDF = {
  SubjectId: "maths-by-sachin-jakhar-sir-095452",
  PdfId: "6ac8fcd73e8f494425245d7b",
  AttachmentId: "6ac8fc6e8038a98547edb3a1",
};
// ====================================================================

const logEl = document.getElementById("log");
const videoEl = document.getElementById("video");
const pdfFrame = document.getElementById("pdfFrame");

function say(msg, isErr = false) {
  const line = document.createElement("span");
  line.className = isErr ? "err" : "";
  line.textContent = new Date().toLocaleTimeString() + "  " + msg + "\n";
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

async function getJSON(path) {
  const r = await fetch(API + path);
  const text = await r.text();
  say(`${path.split("?")[0]} -> HTTP ${r.status}`, !r.ok);
  try {
    return JSON.parse(text);
  } catch {
    say("   not JSON: " + text.slice(0, 200), true);
    return null;
  }
}

async function playVideo(ids = { subjectId: VIDEO_SUBJECT_ID, childId: CHILD_ID }) {
  try {
    const q = new URLSearchParams({
      batchId: BATCH_ID,
      subjectId: ids.subjectId,
      childId: ids.childId,
      videoType: VIDEO_TYPE,
    }).toString();

    say("1. video-url");
    await getJSON(`/video-url?${q}`);

    say("2. video-keys");
    const vk = await getJSON(`/video-keys?${q}`);
    const d = vk?.data;
    if (!d) return;

    const keys = d.clearKeys || {};
    const hasKeys = Object.keys(keys).length > 0;
    say(`   clearKeys count: ${Object.keys(keys).length} (${hasKeys ? "DRM" : "no DRM"})`);

    const streamUrl = d.signedUrl ? d.url + d.signedUrl : d.url;
    const isHls = streamUrl.split("?")[0].endsWith(".m3u8");
    const mime = isHls ? "application/x-mpegurl" : "application/dash+xml";
    const manifest = `${API}/play?url=${encodeURIComponent(streamUrl)}`;

    say("2b. probing manifest through proxy");
    const probe = await fetch(manifest);
    const ptxt = await probe.text();
    say(`   status ${probe.status}, content-type: ${probe.headers.get("content-type")}, length: ${ptxt.length}`, !probe.ok);
    say("   starts with: " + ptxt.slice(0, 200).replace(/\s+/g, " "));
    if (isHls) {
      const lines = ptxt.split("\n").filter(l => l && !l.startsWith("#")).slice(0, 2);
      say("   first URIs: " + lines.map(l => l.slice(0, 120)).join(" | "));
    }
    if (!isHls) {
      const bm = ptxt.match(/<BaseURL>([^<]+)<\/BaseURL>/);
      if (!bm) {
        say("   no BaseURL found in manifest", true);
      } else {
        const segUrl = bm[1] + "dash/audio/init.mp4";
        say("   segment probe: " + segUrl.slice(0, 120) + "...");
        const r2 = await fetch(segUrl);
        say(`   segment probe status ${r2.status}, content-type: ${r2.headers.get("content-type")}`, !r2.ok);
        if (!r2.ok) say("   segment body: " + (await r2.text()).slice(0, 200), true);
      }
    }

    say(`3. loading ${isHls ? "HLS" : "DASH"} through proxy`);
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) throw new Error("browser not supported by shaka");

    if (window.player) await window.player.destroy();
    const player = new shaka.Player();
    window.player = player;
    await player.attach(videoEl);

    if (hasKeys) player.configure({ drm: { clearKeys: keys } });
    player.addEventListener("error", e =>
      say(`SHAKA ERROR code=${e.detail.code} category=${e.detail.category}`, true)
    );

    await player.load(manifest, null, mime);
    say("4. loaded, playing");
    videoEl.play().catch(() => say("   press play to start"));
  } catch (e) {
    say("ERROR: " + e.message, true);
  }
}

async function todaysSchedule() {
  try {
    const r = await fetch(`${API}/todays-schedule`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ batchId: BATCH_ID }),
    });
    const text = await r.text();
    say(`todays-schedule -> HTTP ${r.status}`, !r.ok);
    say("   " + text.slice(0, 600));
  } catch (e) {
    say("ERROR: " + e.message, true);
  }
}

async function openPdf() {
  try {
    const q = new URLSearchParams({
      BatchId: BATCH_ID,
      SubjectId: PDF.SubjectId,
      PdfId: PDF.PdfId,
      AttachmentId: PDF.AttachmentId,
    }).toString();

    const d = await getJSON(`/pdf?${q}`);
    const file = d?.data?.baseUrl && d?.data?.key ? d.data.baseUrl + d.data.key : null;
    if (!file) {
      say("No PDF url in response", true);
      return;
    }
    say("PDF: " + (d.data.name || "(no name)"));
    pdfFrame.src = `${API}/file?url=${encodeURIComponent(file)}`;
    pdfFrame.hidden = false;
  } catch (e) {
    say("ERROR: " + e.message, true);
  }
}

document.getElementById("playBtn").addEventListener("click", () => playVideo());
document.getElementById("liveBtn").addEventListener("click", () => playVideo(LIVE));
document.getElementById("schedBtn").addEventListener("click", todaysSchedule);
document.getElementById("pdfBtn").addEventListener("click", openPdf);
</script>
</body>
</html>
